# ==============================================================================
# GitHub Actions Workflow: Publish Python Package to PyPI
# ==============================================================================
#
# Before running this workflow, create an API token on https://pypi.org
# (Account Settings -> API tokens) and register the following secret in:
# GitHub Repository -> Settings -> Secrets and variables -> Actions:
#
# Secret Name: PYPI_API_TOKEN
# Secret Value: pypi-AgEIcHlwaS5vcmc... (seu token gerado no PyPI)
# ==============================================================================

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build, Test and Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Build Source and Binary Distributions
        run: |
          python -m build

      - name: Validate Built Packages
        run: |
          twine check dist/*

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
